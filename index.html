<pre id="gemza-debug" style="color:#ff7777;background:#171717;padding:12px;white-space:pre-wrap;"></pre>

<script>
window.addEventListener("error", function(event) {
  document.getElementById("gemza-debug").textContent =
    "JavaScript error: " + event.message;
});

window.addEventListener("unhandledrejection", function(event) {
  document.getElementById("gemza-debug").textContent =
    "Promise error: " + String(event.reason);
});
</script>
